spring.application.name=ecifit-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecifit}
spring.datasource.username=${DB_USER:ecifit}
spring.datasource.password=${DB_PASSWORD:ecifit}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.co.edu.escuelaing.ecifit=INFO
