spring.application.name=ecifit-backend
server.port=8080

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecifit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecifit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ecifit}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.co.edu.eci.dosw.ecifit=INFO

# JWT & Security
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}